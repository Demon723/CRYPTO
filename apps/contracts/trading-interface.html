<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LXON Swap</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: #94a3b8; font-size: 1.1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #a78bfa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.875rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      font-size: 1rem;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: white;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: rgba(71, 85, 105, 0.8);
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 1);
    }
    .result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.875rem;
      word-break: break-all;
    }
    .result.success {
      background: rgba(5, 46, 22, 0.5);
      border: 1px solid rgba(22, 101, 52, 0.5);
      color: #4ade80;
    }
    .result.error {
      background: rgba(69, 10, 10, 0.5);
      border: 1px solid rgba(153, 27, 27, 0.5);
      color: #f87171;
    }
    .result.info {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.5);
      color: #94a3b8;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .status-item {
      background: rgba(15, 23, 42, 0.5);
      padding: 16px;
      border-radius: 12px;
    }
    .status-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-value {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 8px;
      color: #e2e8f0;
    }
    .swap-direction {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }
    .swap-icon {
      font-size: 1.5rem;
      color: #a78bfa;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .swap-icon:hover {
      transform: rotate(180deg);
    }
    .price-info {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 8px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(22, 101, 52, 0.3);
      color: #4ade80;
      margin-top: 12px;
    }
    .wallet-section {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .wallet-section button {
      width: auto;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🪙 LXON Swap</h1>
      <p class="subtitle">Decentralized Exchange on LXON Blockchain</p>
      <div class="wallet-section">
        <button onclick="connectWallet()">Connect Wallet</button>
        <button class="btn-secondary" onclick="addLXONChain()">Add LXON Chain</button>
      </div>
      <div id="walletInfo"></div>
    </div>

    <div class="grid">
      <!-- Swap Card -->
      <div class="card">
        <div class="card-title">🔄 Swap Tokens</div>
        
        <div class="form-group">
          <label>From Token</label>
          <input type="text" id="fromAmount" placeholder="Amount" />
          <select id="fromToken" style="margin-top: 8px;">
            <option value="NATIVE">Native Token</option>
            <option value="LXON">XON</option>
          </select>
        </div>
        
        <div class="swap-direction">
          <span class="swap-icon" onclick="swapDirection()">⇅</span>
        </div>
        
        <div class="form-group">
          <label>To Token</label>
          <input type="text" id="toAmount" placeholder="Estimated amount" readonly />
          <select id="toToken" style="margin-top: 8px;">
            <option value="LXON">XON</option>
            <option value="NATIVE">Native Token</option>
          </select>
        </div>
        
        <div class="price-info" id="priceInfo">Enter amount to see price</div>
        
        <button id="swapButton" onclick="executeSwap()" disabled>Connect Wallet to Swap</button>
        <div id="swapResult"></div>
      </div>

      <!-- Pool Info Card -->
      <div class="card">
        <div class="card-title">💧 Pool Information</div>
        <div id="poolInfo">
          <div class="result info">Loading pool information...</div>
        </div>
      </div>

      <!-- Account Info Card -->
      <div class="card">
        <div class="card-title">👛 Account Information</div>
        <div id="accountInfo">
          <div class="result info">Connect wallet to view account</div>
        </div>
      </div>

      <!-- Token Info Card -->
      <div class="card">
        <div class="card-title">📊 Token Information</div>
        <div id="tokenInfo">
          <div class="result info">Loading token information...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // LXON Native Ecosystem Contracts (localhost deployment)
    const CONTRACTS = {
      LXON_TOKEN: '0x5FC8d32690cc91D4c39d9d3abcBD16989F875707',
      SWAP: '0x0165878A594ca255338adfa4d48449f69242Eb8F',
      RPC_URL: 'http://localhost:8545',
      CHAIN_ID: 723,
      CHAIN_NAME: 'LXON Mainnet',
      NATIVE_CURRENCY: {
        name: 'LXON',
        symbol: 'XON',
        decimals: 18
      }
    };

    // Native token ABI
    const LXON_ABI = [
      'function balanceOf(address owner) view returns (uint256)',
      'function approve(address spender, uint256 amount) returns (bool)',
      'function name() view returns (string)',
      'function symbol() view returns (string)',
      'function decimals() view returns (uint8)',
      'function totalSupply() view returns (uint256)',
      'function transfer(address to, uint256 amount) returns (bool)'
    ];

    // Native swap ABI
    const SWAP_ABI = [
      'function getReserves() view returns (uint256, uint256)',
      'function addLiquidity(uint256 tokenAmount) payable',
      'function swapNativeForToken() payable returns (uint256)',
      'function swapTokenForNative(uint256 tokenAmount) returns (uint256)'
    ];

    let provider;
    let signer;
    let address;

    async function init() {
      try {
        // Use JSON-RPC provider for reads
        provider = new ethers.JsonRpcProvider(CONTRACTS.RPC_URL);
        
        // Load static data
        await loadPoolInfo();
        await loadTokenInfo();
        
        // Check if wallet is already connected
        if (typeof window.ethereum !== 'undefined') {
          const accounts = await window.ethereum.request({ method: 'eth_accounts' });
          if (accounts.length > 0) {
            await connectWallet();
          }
        }
      } catch (error) {
        console.error('Initialization error:', error);
        document.getElementById('poolInfo').innerHTML = 
          '<div class="result error">Failed to connect to blockchain. Make sure the node is running.</div>';
      }
    }

    async function connectWallet() {
      if (typeof window.ethereum === 'undefined') {
        alert('Please install MetaMask or another Web3 wallet');
        return;
      }

      try {
        // Request account access
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        address = await signer.getAddress();
        
        // Add LXON chain if not already added
        await addLXONChain();
        
        // Switch to LXON chain
        await switchToLXONChain();
        
        updateWalletUI();
        await loadAccountInfo();
        
        document.getElementById('swapButton').disabled = false;
        document.getElementById('swapButton').textContent = 'Swap';
      } catch (error) {
        console.error('Wallet connection error:', error);
        alert('Failed to connect wallet: ' + error.message);
      }
    }

    async function addLXONChain() {
      if (typeof window.ethereum === 'undefined') return;

      try {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x2d3', // 723 in hex
            chainName: CONTRACTS.CHAIN_NAME,
            nativeCurrency: CONTRACTS.NATIVE_CURRENCY,
            rpcUrls: [CONTRACTS.RPC_URL],
            blockExplorerUrls: []
          }],
        });
      } catch (error) {
        console.log('Chain add failed or already added:', error);
      }
    }

    async function switchToLXONChain() {
      if (typeof window.ethereum === 'undefined') return;

      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: '0x2d3' }],
        });
      } catch (error) {
        console.log('Chain switch failed:', error);
      }
    }

    function updateWalletUI() {
      const walletInfo = document.getElementById('walletInfo');
      if (address) {
        walletInfo.innerHTML = `<div class="badge">Connected: ${address.slice(0, 6)}...${address.slice(-4)}</div>`;
      } else {
        walletInfo.innerHTML = '';
      }
    }

    async function loadPoolInfo() {
      try {
        const swap = new ethers.Contract(CONTRACTS.SWAP, SWAP_ABI, provider);
        const [reserveNative, reserveToken] = await swap.getReserves();
        const pricePerXON = (Number(reserveNative) / Number(reserveToken)).toFixed(6);
        
        document.getElementById('poolInfo').innerHTML = `
          <div class="status-grid">
            <div class="status-item">
              <div class="status-label">Native Reserve</div>
              <div class="status-value">${ethers.formatEther(reserveNative)} XON</div>
            </div>
            <div class="status-item">
              <div class="status-label">XON Reserve</div>
              <div class="status-value">${ethers.formatEther(reserveToken)} XON</div>
            </div>
            <div class="status-item">
              <div class="status-label">Price per XON</div>
              <div class="status-value">${pricePerXON} Native</div>
            </div>
            <div class="status-item">
              <div class="status-label">Fee</div>
              <div class="status-value">0.3%</div>
            </div>
          </div>
        `;
      } catch (error) {
        document.getElementById('poolInfo').innerHTML = 
          '<div class="result error">Failed to load pool information</div>';
      }
    }

    async function loadTokenInfo() {
      try {
        const token = new ethers.Contract(CONTRACTS.LXON_TOKEN, LXON_ABI, provider);
        const name = await token.name();
        const symbol = await token.symbol();
        const totalSupply = await token.totalSupply();
        
        document.getElementById('tokenInfo').innerHTML = `
          <div class="status-grid">
            <div class="status-item">
              <div class="status-label">Token Name</div>
              <div class="status-value">${name}</div>
            </div>
            <div class="status-item">
              <div class="status-label">Symbol</div>
              <div class="status-value">${symbol}</div>
            </div>
            <div class="status-item" style="grid-column: span 2">
              <div class="status-label">Total Supply</div>
              <div class="status-value">${ethers.formatEther(totalSupply)} ${symbol}</div>
            </div>
          </div>
        `;
      } catch (error) {
        document.getElementById('tokenInfo').innerHTML = 
          '<div class="result error">Failed to load token information</div>';
      }
    }

    async function loadAccountInfo() {
      if (!address || !provider) return;
      
      try {
        const token = new ethers.Contract(CONTRACTS.LXON_TOKEN, LXON_ABI, provider);
        const xonBalance = await token.balanceOf(address);
        const nativeBalance = await provider.getBalance(address);
        
        document.getElementById('accountInfo').innerHTML = `
          <div class="result success">
            <div class="status-grid">
              <div class="status-item">
                <div class="status-label">XON Balance</div>
                <div class="status-value">${ethers.formatEther(xonBalance)} XON</div>
              </div>
              <div class="status-item">
                <div class="status-label">Native Balance</div>
                <div class="status-value">${ethers.formatEther(nativeBalance)} Native</div>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        document.getElementById('accountInfo').innerHTML = 
          '<div class="result error">Failed to load account</div>';
      }
    }

    function swapDirection() {
      const fromToken = document.getElementById('fromToken');
      const toToken = document.getElementById('toToken');
      const temp = fromToken.value;
      fromToken.value = toToken.value;
      toToken.value = temp;
      updatePrices();
    }

    async function updatePrices() {
      const fromToken = document.getElementById('fromToken').value;
      const toToken = document.getElementById('toToken').value;
      const fromAmount = document.getElementById('fromAmount').value;
      
      if (!fromAmount || parseFloat(fromAmount) <= 0) {
        document.getElementById('toAmount').value = '';
        document.getElementById('priceInfo').textContent = 'Enter amount to see price';
        return;
      }
      
      try {
        const swap = new ethers.Contract(CONTRACTS.SWAP, SWAP_ABI, provider);
        const amount = ethers.parseEther(fromAmount);
        
        let quote;
        if (fromToken === 'LXON' && toToken === 'NATIVE') {
          // XON -> Native: getNativeToLXONQuote gives native out for token in
          // But our contract uses swapTokenForNative, so we need to estimate
          const [reserveNative, reserveToken] = await swap.getReserves();
          const amountOut = (amount * reserveNative) / (reserveToken + amount) * 997 / 1000;
          quote = amountOut;
        } else if (fromToken === 'NATIVE' && toToken === 'LXON') {
          // Native -> XON: getReserves and calculate
          const [reserveNative, reserveToken] = await swap.getReserves();
          const amountOut = (amount * reserveToken) / (reserveNative + amount) * 997 / 1000;
          quote = amountOut;
        }
        
        document.getElementById('toAmount').value = ethers.formatEther(quote);
        document.getElementById('priceInfo').textContent = 
          `1 ${fromToken} ≈ ${ethers.formatEther(quote)} ${toToken}`;
      } catch (error) {
        document.getElementById('priceInfo').textContent = 'Failed to get price quote';
      }
    }

    async function executeSwap() {
      if (!signer) {
        alert('Please connect your wallet first');
        return;
      }

      const fromToken = document.getElementById('fromToken').value;
      const toToken = document.getElementById('toToken').value;
      const fromAmount = document.getElementById('fromAmount').value;
      const resultDiv = document.getElementById('swapResult');
      
      if (!fromAmount || parseFloat(fromAmount) <= 0) {
        resultDiv.innerHTML = '<div class="result error">Please enter a valid amount</div>';
        return;
      }
      
      try {
        const swap = new ethers.Contract(CONTRACTS.SWAP, SWAP_ABI, signer);
        const token = new ethers.Contract(CONTRACTS.LXON_TOKEN, LXON_ABI, signer);
        const amount = ethers.parseEther(fromAmount);
        
        resultDiv.innerHTML = '<div class="result info">Processing swap...</div>';
        
        if (fromToken === 'NATIVE' && toToken === 'LXON') {
          // Native -> XON
          const swapTx = await swap.swapNativeForToken({ value: amount });
          await swapTx.wait();
          resultDiv.innerHTML = '<div class="result success">✅ Swap completed successfully!</div>';
        } else if (fromToken === 'LXON' && toToken === 'NATIVE') {
          // XON -> Native: approve then swap
          const approveTx = await token.approve(CONTRACTS.SWAP, amount);
          await approveTx.wait();
          
          const swapTx = await swap.swapTokenForNative(amount);
          await swapTx.wait();
          resultDiv.innerHTML = '<div class="result success">✅ Swap completed successfully!</div>';
        }
        
        // Refresh
        await loadPoolInfo();
        await loadAccountInfo();
      } catch (error) {
        resultDiv.innerHTML = `<div class="result error">❌ Swap failed: ${error.message}</div>`;
      }
    }

    // Event listeners
    document.getElementById('fromAmount').addEventListener('input', updatePrices);
    document.getElementById('fromToken').addEventListener('change', updatePrices);
    document.getElementById('toToken').addEventListener('change', updatePrices);

    // Initialize on load
    window.addEventListener('load', init);
  </script>
</body>
</html>
