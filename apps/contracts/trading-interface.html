<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LXON Trading Interface</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    
    .coin-display {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    
    .coin-image {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }
    
    .coin-image:hover {
      transform: scale(1.1) rotate(5deg);
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle { color: #94a3b8; font-size: 1.1rem; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
    }
    
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }
    
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #a78bfa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-group { margin-bottom: 16px; }
    
    label {
      display: block;
      font-size: 0.875rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      font-size: 1rem;
      transition: all 0.2s;
    }
    
    input:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }
    
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: white;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-secondary {
      background: rgba(71, 85, 105, 0.8);
      margin-top: 8px;
    }
    
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 1);
    }
    
    .result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.875rem;
      word-break: break-all;
    }
    
    .result.success {
      background: rgba(5, 46, 22, 0.5);
      border: 1px solid rgba(22, 101, 52, 0.5);
      color: #4ade80;
    }
    
    .result.error {
      background: rgba(69, 10, 10, 0.5);
      border: 1px solid rgba(153, 27, 27, 0.5);
      color: #f87171;
    }
    
    .result.info {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.5);
      color: #94a3b8;
    }
    
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .status-item {
      background: rgba(15, 23, 42, 0.5);
      padding: 16px;
      border-radius: 12px;
    }
    
    .status-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .status-value {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 8px;
      color: #e2e8f0;
    }
    
    .swap-direction {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }
    
    .swap-icon {
      font-size: 1.5rem;
      color: #a78bfa;
      cursor: pointer;
      transition: transform 0.3s;
    }
    
    .swap-icon:hover {
      transform: rotate(180deg);
    }
    
    .price-info {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 8px;
      text-align: center;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(22, 101, 52, 0.3);
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🪙 LXON Trading Interface</h1>
      <p class="subtitle">Decentralized Exchange on LXON Blockchain</p>
      
      <div class="coin-display">
        <img src="assets/lxon-coin-front.png" alt="LXON Coin Front" class="coin-image" id="coinFront">
        <img src="assets/lxon-coin-back.png" alt="LXON Coin Back" class="coin-image" id="coinBack">
      </div>
      
      <div class="badge">Live on GCE Instance</div>
    </div>

    <div class="grid">
      <!-- Swap Card -->
      <div class="card">
        <div class="card-title">🔄 Swap Tokens</div>
        
        <div class="form-group">
          <label>From Token</label>
          <input type="text" id="fromAmount" placeholder="Amount" />
          <select id="fromToken" style="margin-top: 8px;">
            <option value="LXON">LXON</option>
            <option value="NATIVE">Native Token</option>
          </select>
        </div>
        
        <div class="swap-direction">
          <span class="swap-icon" onclick="swapDirection()">⇅</span>
        </div>
        
        <div class="form-group">
          <label>To Token</label>
          <input type="text" id="toAmount" placeholder="Estimated amount" readonly />
          <select id="toToken" style="margin-top: 8px;">
            <option value="NATIVE">Native Token</option>
            <option value="LXON">LXON</option>
          </select>
        </div>
        
        <div class="price-info" id="priceInfo">Loading prices...</div>
        
        <button onclick="executeSwap()">Execute Swap</button>
        <div id="swapResult"></div>
      </div>

      <!-- Pool Info Card -->
      <div class="card">
        <div class="card-title">💧 Pool Information</div>
        <div id="poolInfo">
          <div class="result info">Loading pool information...</div>
        </div>
      </div>

      <!-- Account Info Card -->
      <div class="card">
        <div class="card-title">👛 Account Information</div>
        <div class="form-group">
          <label>Wallet Address</label>
          <input type="text" id="walletAddress" placeholder="0x..." />
        </div>
        <button class="btn-secondary" onclick="checkAccount()">Check Account</button>
        <div id="accountResult"></div>
      </div>

      <!-- Token Info Card -->
      <div class="card">
        <div class="card-title">📊 Token Information</div>
        <div id="tokenInfo">
          <div class="result info">Loading token information...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONTRACTS = {
      LXON_TOKEN: '0x7A0F16bE284ad1F7bF158668704C6Ca9e44f2D00',
      SWAP: '0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0',
      RPC_URL: 'http://localhost:8545'
    };

    // Simple ABI for the contracts
    const LXON_ABI = [
      'function balanceOf(address owner) view returns (uint256)',
      'function approve(address spender, uint256 amount) returns (bool)',
      'function name() view returns (string)',
      'function symbol() view returns (string)',
      'function decimals() view returns (uint8)',
      'function totalSupply() view returns (uint256)'
    ];

    const SWAP_ABI = [
      'function getReserves() view returns (uint256, uint256)',
      'function getLXONToNativeQuote(uint256 amount) view returns (uint256)',
      'function getNativeToLXONQuote(uint256 amount) view returns (uint256)',
      'function swapLXONForNative(uint256 amount)',
      'function swapNativeForLXON() payable',
      'function FEE_RATE() view returns (uint256)',
      'function FEE_DENOMINATOR() view returns (uint256)'
    ];

    let provider;
    let signer;

    async function init() {
      try {
        // Try to connect to local blockchain
        if (typeof window.ethereum !== 'undefined') {
          provider = new ethers.providers.Web3Provider(window.ethereum);
          signer = provider.getSigner();
        } else {
          // Fallback to HTTP provider
          provider = new ethers.providers.JsonRpcProvider(CONTRACTS.RPC_URL);
        }
        
        loadPoolInfo();
        loadTokenInfo();
        updatePrices();
        
        // Auto-load wallet address if connected
        if (signer) {
          try {
            const address = await signer.getAddress();
            document.getElementById('walletAddress').value = address;
            checkAccount();
          } catch (e) {
            console.log('No wallet connected');
          }
        }
      } catch (error) {
        console.error('Initialization error:', error);
        document.getElementById('poolInfo').innerHTML = 
          '<div class="result error">Failed to connect to blockchain. Make sure the node is running.</div>';
      }
    }

    async function loadPoolInfo() {
      try {
        const swap = new ethers.Contract(CONTRACTS.SWAP, SWAP_ABI, provider);
        const [reserveLXON, reserveNative] = await swap.getReserves();
        const feeRate = await swap.FEE_RATE();
        const feeDenom = await swap.FEE_DENOMINATOR();
        
        const feePercent = (feeRate / feeDenom * 100).toFixed(2);
        const pricePerLXON = (Number(reserveNative) / Number(reserveLXON)).toFixed(6);
        
        document.getElementById('poolInfo').innerHTML = `
          <div class="status-grid">
            <div class="status-item">
              <div class="status-label">LXON Reserve</div>
              <div class="status-value">${ethers.utils.formatEther(reserveLXON)} LXON</div>
            </div>
            <div class="status-item">
              <div class="status-label">Native Reserve</div>
              <div class="status-value">${ethers.utils.formatEther(reserveNative)} Native</div>
            </div>
            <div class="status-item">
              <div class="status-label">Price per LXON</div>
              <div class="status-value">${pricePerLXON} Native</div>
            </div>
            <div class="status-item">
              <div class="status-label">Trading Fee</div>
              <div class="status-value">${feePercent}%</div>
            </div>
          </div>
        `;
      } catch (error) {
        document.getElementById('poolInfo').innerHTML = 
          '<div class="result error">Failed to load pool information</div>';
      }
    }

    async function loadTokenInfo() {
      try {
        const lxon = new ethers.Contract(CONTRACTS.LXON_TOKEN, LXON_ABI, provider);
        const name = await lxon.name();
        const symbol = await lxon.symbol();
        const totalSupply = await lxon.totalSupply();
        
        document.getElementById('tokenInfo').innerHTML = `
          <div class="status-grid">
            <div class="status-item">
              <div class="status-label">Token Name</div>
              <div class="status-value">${name}</div>
            </div>
            <div class="status-item">
              <div class="status-label">Symbol</div>
              <div class="status-value">${symbol}</div>
            </div>
            <div class="status-item" style="grid-column: span 2">
              <div class="status-label">Total Supply</div>
              <div class="status-value">${ethers.utils.formatEther(totalSupply)} ${symbol}</div>
            </div>
          </div>
        `;
      } catch (error) {
        document.getElementById('tokenInfo').innerHTML = 
          '<div class="result error">Failed to load token information</div>';
      }
    }

    async function checkAccount() {
      const address = document.getElementById('walletAddress').value;
      const resultDiv = document.getElementById('accountResult');
      
      if (!address) {
        resultDiv.innerHTML = '<div class="result error">Please enter a wallet address</div>';
        return;
      }
      
      try {
        const lxon = new ethers.Contract(CONTRACTS.LXON_TOKEN, LXON_ABI, provider);
        const lxonBalance = await lxon.balanceOf(address);
        const nativeBalance = await provider.getBalance(address);
        
        resultDiv.innerHTML = `
          <div class="result success">
            <div class="status-grid">
              <div class="status-item">
                <div class="status-label">LXON Balance</div>
                <div class="status-value">${ethers.utils.formatEther(lxonBalance)} LXON</div>
              </div>
              <div class="status-item">
                <div class="status-label">Native Balance</div>
                <div class="status-value">${ethers.utils.formatEther(nativeBalance)} Native</div>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = '<div class="result error">Failed to check account</div>';
      }
    }

    function swapDirection() {
      const fromToken = document.getElementById('fromToken');
      const toToken = document.getElementById('toToken');
      const temp = fromToken.value;
      fromToken.value = toToken.value;
      toToken.value = temp;
      updatePrices();
    }

    async function updatePrices() {
      const fromToken = document.getElementById('fromToken').value;
      const toToken = document.getElementById('toToken').value;
      const fromAmount = document.getElementById('fromAmount').value;
      
      if (!fromAmount || parseFloat(fromAmount) <= 0) {
        document.getElementById('toAmount').value = '';
        document.getElementById('priceInfo').textContent = 'Enter amount to see price';
        return;
      }
      
      try {
        const swap = new ethers.Contract(CONTRACTS.SWAP, SWAP_ABI, provider);
        const amount = ethers.utils.parseEther(fromAmount);
        
        let quote;
        if (fromToken === 'LXON' && toToken === 'NATIVE') {
          quote = await swap.getLXONToNativeQuote(amount);
          document.getElementById('toAmount').value = ethers.utils.formatEther(quote);
        } else if (fromToken === 'NATIVE' && toToken === 'LXON') {
          quote = await swap.getNativeToLXONQuote(amount);
          document.getElementById('toAmount').value = ethers.utils.formatEther(quote);
        }
        
        document.getElementById('priceInfo').textContent = 
          `1 ${fromToken} ≈ ${ethers.utils.formatEther(quote)} ${toToken}`;
      } catch (error) {
        document.getElementById('priceInfo').textContent = 'Failed to get price quote';
      }
    }

    async function executeSwap() {
      const fromToken = document.getElementById('fromToken').value;
      const toToken = document.getElementById('toToken').value;
      const fromAmount = document.getElementById('fromAmount').value;
      const resultDiv = document.getElementById('swapResult');
      
      if (!fromAmount || parseFloat(fromAmount) <= 0) {
        resultDiv.innerHTML = '<div class="result error">Please enter a valid amount</div>';
        return;
      }
      
      if (!signer) {
        resultDiv.innerHTML = '<div class="result error">Please connect your wallet first</div>';
        return;
      }
      
      try {
        const swap = new ethers.Contract(CONTRACTS.SWAP, SWAP_ABI, signer);
        const lxon = new ethers.Contract(CONTRACTS.LXON_TOKEN, LXON_ABI, signer);
        const amount = ethers.utils.parseEther(fromAmount);
        
        resultDiv.innerHTML = '<div class="result info">Processing swap...</div>';
        
        if (fromToken === 'LXON' && toToken === 'NATIVE') {
          // Approve LXON tokens
          const approveTx = await lxon.approve(CONTRACTS.SWAP, amount);
          await approveTx.wait();
          
          // Execute swap
          const swapTx = await swap.swapLXONForNative(amount);
          await swapTx.wait();
          
          resultDiv.innerHTML = '<div class="result success">✅ Swap completed successfully!</div>';
        } else if (fromToken === 'NATIVE' && toToken === 'LXON') {
          // Execute swap with native tokens
          const swapTx = await swap.swapNativeForLXON({ value: amount });
          await swapTx.wait();
          
          resultDiv.innerHTML = '<div class="result success">✅ Swap completed successfully!</div>';
        }
        
        // Refresh information
        loadPoolInfo();
        checkAccount();
      } catch (error) {
        resultDiv.innerHTML = `<div class="result error">❌ Swap failed: ${error.message}</div>`;
      }
    }

    // Event listeners
    document.getElementById('fromAmount').addEventListener('input', updatePrices);
    document.getElementById('fromToken').addEventListener('change', updatePrices);
    document.getElementById('toToken').addEventListener('change', updatePrices);

    // Initialize on load
    window.addEventListener('load', init);
  </script>
  
  <!-- Load ethers.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</body>
</html>
