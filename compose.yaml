services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cryptomind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: backend
    build:
      context: apps/backend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cryptomind?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/cryptomind?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - postgres
      - redis

  frontend:
    image: frontend
    build:
      context: apps/frontend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  lxon-node:
    image: lxon-blockchain-node
    build:
      context: apps/lxon-blockchain
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8545
      CHAIN_ID: 723
      NODE_ID: lxon-node-1
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - lxon_node_data:/data

volumes:
  postgres_data:
  redis_data:
  lxon_node_data:
