name: Build and Push to ECR

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        include:
          - service: lxon-node
            dockerfile: docker/lxon-node.Dockerfile
          - service: lxon-backend
            dockerfile: docker/lxon-backend.Dockerfile
          - service: lxon-explorer
            dockerfile: docker/lxon-explorer.Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.service }}:latest \
            -t ${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Push to ECR
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com"
          docker tag ${{ matrix.service }}:latest ${ECR_REGISTRY}/${{ matrix.service }}:latest
          docker tag ${{ matrix.service }}:${{ github.sha }} ${ECR_REGISTRY}/${{ matrix.service }}:${{ github.sha }}
          docker push ${ECR_REGISTRY}/${{ matrix.service }}:latest
          docker push ${ECR_REGISTRY}/${{ matrix.service }}:${{ github.sha }}

      - name: Output image URI
        run: |
          echo "Image URI: ${{ matrix.service }}:${{ github.sha }}"

  deploy-to-ecs:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && secrets.AWS_ROLE_TO_ASSUME != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service - lxon-node
        run: |
          aws ecs update-service \
            --cluster lxon-prod \
            --service lxon-node \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS service - lxon-backend
        run: |
          aws ecs update-service \
            --cluster lxon-prod \
            --service lxon-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS service - lxon-explorer
        run: |
          aws ecs update-service \
            --cluster lxon-prod \
            --service lxon-explorer \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster lxon-prod \
            --services lxon-node lxon-backend lxon-explorer \
            --region ${{ env.AWS_REGION }}
